name: Deploy PWA su GitHub Pages

# Deploya il lettore (app/) alla radice di davidelarcier.github.io a ogni push
# su main. Il repo è autosufficiente: contiene app + edizioni FILTRATE, nessun
# codice della pipeline. Le edizioni non sono rigenerabili su CI (sono l'output
# della pipeline locale) → arrivano committate nel repo, non prodotte qui.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permessi minimi per il deploy su Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; non annullare quello in corso (evita mezze pubblicazioni).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Installa dipendenze
        run: npm ci
        working-directory: app
      - name: Build (Vite + service worker)
        run: npm run build
        working-directory: app
      - name: Carica l'artefatto Pages (app/dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
